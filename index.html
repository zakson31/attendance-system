<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance and Results</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#edf3ee;--card:#fff;--ink:#11301b;--muted:#5b7060;--line:#d0ddd2;--accent:#1b7a3a;--onaccent:#fff;--warn:#b45309;--danger:#c62f4a;--brand:#14532d}
  @media(prefers-color-scheme:dark){:root{--bg:#0c1a10;--card:#132a1a;--ink:#e6f2e8;--muted:#8fae96;--line:#24402c;--accent:#6fd68a;--onaccent:#0c1a10;--warn:#f0b35a;--danger:#ff7b92;--brand:#0f3d21}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
  .wrap{max-width:600px;margin:0 auto;padding:22px 16px 70px}
  h1{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin:0 0 10px}
  input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);padding:10px 15px;margin:2px 6px 2px 0}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.small{padding:5px 10px;font-size:.8rem}
  button.danger{background:transparent;color:var(--danger);border-color:var(--line)}
  .row,.two{display:flex;gap:10px;flex-wrap:wrap}.two input{flex:1;min-width:110px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
  .tab{background:transparent;color:var(--ink);border-color:var(--line);white-space:nowrap}
  .tab.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
  .msg{min-height:1.3em;font-size:.9rem;margin:4px 0 8px;color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:26px 0}
  .big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;letter-spacing:.3em;text-transform:uppercase;text-align:center}
  .sess{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;font-weight:700;letter-spacing:.25em;color:var(--warn)}
  .code.off{color:var(--muted);text-decoration:line-through}
  .bar{height:8px;border-radius:8px;background:var(--bg);margin:8px 0;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .grade{font-size:1.8rem;font-weight:800;color:var(--accent)}
  .item{display:flex;flex-direction:column;gap:6px}
  .pw{position:relative}
  .pw input{padding-right:48px}
  button.eye{position:absolute;right:4px;top:4px;width:38px;height:38px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--muted)}
  .hero{background:var(--brand);color:#fff;border-radius:22px;padding:30px 20px 74px;text-align:center}
  .hero img{display:block;width:108px;height:108px;margin:0 auto 14px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .hero h1{font-size:1.35rem;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
  .hero p{margin:0;color:#c9e6d1;font-size:.95rem}
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:-48px 10px 0;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.10)}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;margin:0;background:transparent;color:var(--muted);border:0;border-radius:9px;padding:10px 6px}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .authcard input,.authcard select{padding:13px;margin-bottom:12px}
  .authcard button.primary{width:100%;margin:6px 0 0;padding:13px;font-size:1rem}
  .pw{margin-bottom:12px}
  .authcard .pw input{margin:0;display:block;padding-right:50px}
  .pw button.eye{top:50%;transform:translateY(-50%);right:6px;height:40px}
  .note{text-align:center;color:var(--muted);font-size:.8rem;margin:18px 0 0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:46px;height:46px;border-radius:50%;background:#fff;flex:none}
  .top h1{font-size:1.5rem}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:1.7rem;font-weight:800;color:var(--accent)}
  .stat span{font-size:.8rem;color:var(--muted)}
  .scroll{overflow-x:auto;margin-top:10px}
  .tbl{width:100%;border-collapse:collapse;font-size:.85rem}
  .tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th{color:var(--muted);font-weight:600}
  .pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;color:var(--danger);border:1px solid var(--line);margin-left:8px}
  button.linkbtn{background:none;border:0;padding:6px 2px;margin:0;color:var(--accent);font-weight:600;text-decoration:underline}
  [hidden]{display:none!important}
  @media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>

<script>

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function deviceId() {
    try {
      let d = localStorage.getItem("att_device");
      if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : "d" + Date.now() + Math.random().toString(16).slice(2); localStorage.setItem("att_device", d); }
      return d;
    } catch (e) { return "tmp" + Date.now() + Math.random().toString(16).slice(2); }
  }
  function getPos() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error("This browser cannot share location."));
      navigator.geolocation.getCurrentPosition(
        (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
        () => rej(new Error("Allow location access in your browser, then try again.")),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      if (k === "class") e.className = props[k];
      else if (k.startsWith("on") || k === "value") e[k] = props[k];
      else e.setAttribute(k, props[k]);
    }
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }
  const msg = (t, bad) => { const m = $("msg"); m.textContent = t || ""; m.style.color = bad ? "var(--danger)" : "var(--accent)"; };
  const empty = (t) => h("div", { class: "empty" }, t);
  const grade = (t) => t >= 70 ? "A" : t >= 60 ? "B" : t >= 50 ? "C" : t >= 45 ? "D" : t >= 40 ? "E" : "F";

  const TABS = {
    admin: [["overview", "Overview"], ["courses", "Courses"], ["users", "Users"]],

    student: [["join", "Courses"], ["attend", "Attendance"], ["grades", "Results"]]
  };
  const VIEWS = { overview: vOverview, reports: vReports, courses: vCourses, users: vUsers, mine: vMine, results: vResults, join: vJoin, attend: vAttend, grades: vGrades };

  /* ---------- SHOW / HIDE PASSWORD ---------- */
  const ICON_SHOW = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_HIDE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  document.querySelectorAll('input[type=password]').forEach((inp) => {
    const wrap = h("div", { class: "pw" });
    const eye = h("button", { type: "button", class: "eye", "aria-label": "Show password" });
    eye.innerHTML = ICON_SHOW;
    eye.onclick = () => {
      const hidden = inp.type === "password";
      inp.type = hidden ? "text" : "password";
      eye.innerHTML = hidden ? ICON_HIDE : ICON_SHOW;
      eye.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    };
    inp.replaceWith(wrap);
    wrap.append(inp, eye);
  });

  /* ---------- AUTH ---------- */
  function mode(signup) {
    $("loginCard").hidden = signup; $("signupCard").hidden = !signup;
    $("tabLogin").classList.toggle("on", !signup); $("tabSignup").classList.toggle("on", signup);
    $("authMsg").textContent = ""; $("signMsg").textContent = "";
  }
  function showNotice() { const m = $("authMsg"); m.style.color = noticeBad ? "var(--danger)" : "var(--accent)"; m.textContent = notice; }
  $("tabSignup").onclick = () => { notice = ""; mode(true); };
  $("tabLogin").onclick = () => mode(false);
  $("miniLogo").src = $("bigLogo").src;
  $("role").onchange = () => { $("matric").hidden = $("role").value !== "student"; };

  $("signupBtn").onclick = async () => {
    const m = $("signMsg"); m.style.color = "var(--danger)"; m.textContent = "";
    const role = $("role").value, name = $("name").value.trim(), matric = $("matric").value.trim();
    if (!name) { m.textContent = "Enter your full name."; return; }
    if (role === "student" && !matric) { m.textContent = "Enter your matric number."; return; }
    if ($("spassword").value.length < 6) { m.textContent = "Password must be at least 6 characters."; return; }
    if ($("spassword").value !== $("spassword2").value) { m.textContent = "Passwords do not match."; return; }
    justSignedUp = true;
    const { data, error } = await db.auth.signUp({
      email: $("semail").value.trim(), password: $("spassword").value,
      options: { data: { full_name: name, role, matric_no: role === "student" ? matric : "" } }
    });
    if (error) { justSignedUp = false; m.textContent = error.message; return; }
    notice = data.session ? "Account created. Log in with your email and password." : "Account created. Check your email to confirm it, then log in.";
    noticeBad = false;
    if (data.session) await db.auth.signOut();
    justSignedUp = false;
    $("email").value = $("semail").value.trim();
    ["name", "matric", "semail", "spassword", "spassword2"].forEach((i) => $(i).value = "");
    mode(false); showNotice();
  };
  $("loginBtn").onclick = async () => {
    notice = ""; $("authMsg").style.color = "var(--danger)";
    $("authMsg").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) $("authMsg").textContent = error.message;
  };
  $("logoutBtn").onclick = () => db.auth.signOut();

  $("forgot").onclick = async () => {
    const m = $("authMsg"), email = $("email").value.trim();
    if (!email) { m.style.color = "var(--danger)"; m.textContent = "Type your email above first, then tap Forgot password."; return; }
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    m.style.color = error ? "var(--danger)" : "var(--accent)";
    m.textContent = error ? error.message : "If that email has an account, a reset link has been sent. Check your inbox.";
  };
  function showReset() { $("auth").hidden = true; $("app").hidden = true; $("reset").hidden = false; }
  $("resetBtn").onclick = async () => {
    const m = $("resetMsg"); m.style.color = "var(--danger)"; m.textContent = "";
    if ($("np1").value.length < 6) { m.textContent = "Password must be at least 6 characters."; return; }
    if ($("np1").value !== $("np2").value) { m.textContent = "Passwords do not match."; return; }
    const { error } = await db.auth.updateUser({ password: $("np1").value });
    if (error) { m.textContent = error.message; return; }
    recovering = false; history.replaceState(null, "", location.pathname);
    notice = "Password updated. Log in with your new password."; noticeBad = false;
    $("np1").value = ""; $("np2").value = "";
    await db.auth.signOut();
  };

  async function start(s) {
    if (recovering) { showReset(); return; }
    if (!s) { me = null; mode(false); if (notice) showNotice(); $("reset").hidden = true; $("auth").hidden = false; $("app").hidden = true; return; }
    if (justSignedUp) return;
    if (me && me.id === s.user.id) return;
    const { data, error } = await db.from("profiles").select("*").eq("id", s.user.id).single();
    if (error || !data) { $("auth").hidden = false; $("authMsg").textContent = "Profile not found. Check that the database setup ran."; return; }
    if (data.active === false) { notice = "Your account has been deactivated. Contact the admin."; noticeBad = true; await db.auth.signOut(); return; }
    me = data;
    $("auth").hidden = true; $("app").hidden = false;
    $("who").textContent = (me.full_name || "No name") + " (" + me.role + ")";
    tab = TABS[me.role][0][0];
    drawTabs(); show();
  }
  db.auth.onAuthStateChange((ev, s) => { if (ev === "PASSWORD_RECOVERY") recovering = true; setTimeout(() => start(s), 0); });

  function drawTabs() {
    $("tabs").replaceChildren(...TABS[me.role].map(([k, l]) =>
      h("button", { class: k === tab ? "tab on" : "tab", onclick: () => { tab = k; drawTabs(); show(); } }, l)));
  }
  function show() { msg(""); VIEWS[tab](); }

  /* ---------- REPORTS ---------- */
  function csvDownload(name, rows) {
    const esc = (v) => { let t = String(v ?? ""); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
    const blob = new Blob(["\ufeff" + rows.map((r) => r.map(esc).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = h("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
  }
  function tbl(head, rows) {
    return h("div", { class: "scroll" }, h("table", { class: "tbl" },
      h("thead", {}, h("tr", {}, head.map((t) => h("th", {}, t)))),
      h("tbody", {}, rows.map((r) => h("tr", {}, r.map((c) => h("td", {}, c)))))));
  }
  function reportUI(cs) {
    const sel = h("select", {}, cs.map((c) => h("option", { value: c.id }, c.code + " - " + c.title)));
    const out = h("div");
    async function run(kind) {
      const c = cs.find((x) => x.id === sel.value);
      out.replaceChildren(h("p", { class: "sub" }, "Loading..."));
      const att = kind === "att";
      const { data, error } = await db.rpc(att ? "course_attendance_report" : "course_results_report", { p_course: c.id });
      if (error) return out.replaceChildren(h("p", { class: "msg" }, error.message));
      const head = att ? ["Matric", "Name", "Attended", "Sessions", "Percent"] : ["Matric", "Name", "CA", "Exam", "Total", "Grade"];
      const rows = (data || []).map((r) => att
        ? [r.matric_no || "", r.full_name || "", r.attended, r.total_sessions, (r.total_sessions ? Math.round(100 * r.attended / r.total_sessions) : 0) + "%"]
        : [r.matric_no || "", r.full_name || "", Number(r.ca_score), Number(r.exam_score), Number(r.ca_score) + Number(r.exam_score), grade(Number(r.ca_score) + Number(r.exam_score))]);
      out.replaceChildren(rows.length
        ? h("div", {}, h("button", { class: "ghost small", onclick: () => csvDownload(c.code + (att ? "-attendance.csv" : "-results.csv"), [head, ...rows]) }, "Download CSV"), tbl(head, rows))
        : empty("No students enrolled in this course yet."));
    }
    return h("div", {}, h("div", { class: "card" }, sel, h("button", { onclick: () => run("att") }, "Attendance report"), h("button", { class: "ghost", onclick: () => run("res") }, "Results report")), out);
  }
  async function vOverview() {
    const [{ data: ov }, { data: cs }] = await Promise.all([db.rpc("admin_overview"), db.from("courses").select("id,code,title").order("code")]);
    const o = (ov && ov[0]) || {};
    const stat = (n, l) => h("div", { class: "stat" }, h("b", {}, n ?? 0), h("span", {}, l));
    $("view").replaceChildren(
      h("div", { class: "stats" }, stat(o.n_students, "Students"), stat(o.n_lecturers, "Lecturers"), stat(o.n_courses, "Courses"), stat(o.n_sessions, "Attendance sessions"), stat(o.n_marks, "Attendance marks")),
      cs && cs.length ? reportUI(cs) : empty("Add a course to see reports."));
  }
  async function vReports() {
    const { data: cs } = await db.from("courses").select("id,code,title").eq("lecturer_id", me.id).order("code");
    $("view").replaceChildren(cs && cs.length ? reportUI(cs) : empty("No courses assigned to you yet."));
  }

  /* ---------- ADMIN ---------- */
  async function vCourses() {
    const v = $("view");
    const [{ data: lect }, { data: cs }] = await Promise.all([
      db.from("profiles").select("id,full_name").eq("role", "lecturer"),
      db.from("courses").select("*").order("code")
    ]);
    const lopts = () => [h("option", { value: "" }, "No lecturer"), ...(lect || []).map((l) => h("option", { value: l.id }, l.full_name || "Unnamed"))];
    const code = h("input", { placeholder: "Course code, e.g. CSC401" });
    const title = h("input", { placeholder: "Course title" });
    const sel = h("select", {}, lopts());
    const add = h("button", { onclick: async () => {
      if (!code.value.trim() || !title.value.trim()) return msg("Enter a course code and title.", 1);
      const { error } = await db.from("courses").insert({ code: code.value.trim().toUpperCase(), title: title.value.trim(), lecturer_id: sel.value || null });
      if (error) return msg(error.message, 1);
      msg("Course added."); vCourses();
    } }, "Add course");
    v.replaceChildren(h("div", { class: "card" }, code, title, sel, add), ...(cs || []).map((c) => {
      const ls = h("select", { onchange: async () => {
        const { error } = await db.from("courses").update({ lecturer_id: ls.value || null }).eq("id", c.id);
        msg(error ? error.message : "Lecturer updated.", !!error);
      } }, lopts());
      ls.value = c.lecturer_id || "";
      const del = h("button", { class: "danger small", onclick: async () => {
        if (!confirm("Delete " + c.code + " and all its records?")) return;
        const { error } = await db.from("courses").delete().eq("id", c.id);
        if (error) return msg(error.message, 1);
        vCourses();
      } }, "Delete course");
      return h("div", { class: "card item" }, h("b", {}, c.code), h("div", {}, c.title), ls, h("div", {}, del));
    }));
    if (!(cs || []).length) v.append(empty("No courses yet. Add the first one above."));
  }

  async function vUsers() {
    const { data } = await db.from("profiles").select("*").order("created_at", { ascending: false });
    $("view").replaceChildren(...(data || []).map((p) => {
      const s = h("select", { onchange: async () => {
        const { error } = await db.from("profiles").update({ role: s.value }).eq("id", p.id);
        msg(error ? error.message : "Role updated.", !!error);
      } }, ["student", "lecturer", "admin"].map((r) => h("option", { value: r }, r)));
      s.value = p.role;
      const tog = p.id === me.id ? null : h("button", { class: p.active === false ? "small" : "danger small", onclick: async () => {
        const { error } = await db.from("profiles").update({ active: p.active === false }).eq("id", p.id);
        if (error) return msg(error.message, 1);
        msg(p.active === false ? "Account activated." : "Account deactivated."); vUsers();
      } }, p.active === false ? "Activate" : "Deactivate");
      return h("div", { class: "card" }, h("b", {}, p.full_name || "No name"), p.active === false && h("span", { class: "pill" }, "Deactivated"), h("div", { class: "sub" }, p.matric_no || "No matric number"), s, tog);
    }));
  }

  /* ---------- LECTURER ---------- */
  async function vMine() {
    const v = $("view");
    const { data: cs } = await db.from("courses").select("*").eq("lecturer_id", me.id).order("code");
    if (!cs || !cs.length) { v.replaceChildren(empty("No courses assigned to you yet. Ask the admin to assign one.")); return; }
    const { data: ss } = await db.from("attendance_sessions").select("*").in("course_id", cs.map((c) => c.id)).order("created_at", { ascending: false });
    const ids = (ss || []).map((s) => s.id), counts = {};
    if (ids.length) {
      const { data: at } = await db.from("attendance").select("session_id").in("session_id", ids);
      (at || []).forEach((a) => counts[a.session_id] = (counts[a.session_id] || 0) + 1);
    }
    v.replaceChildren(...cs.map((c) => {
      const list = (ss || []).filter((s) => s.course_id === c.id).slice(0, 5).map((s) =>
        h("div", { class: "sess" },
          h("span", { class: s.is_open ? "code" : "code off" }, s.code),
          h("span", { class: "sub" }, (counts[s.id] || 0) + " present, " + new Date(s.created_at).toLocaleString()),
          s.is_open && h("button", { class: "ghost small", onclick: async () => {
            await db.from("attendance_sessions").update({ is_open: false }).eq("id", s.id); vMine();
          } }, "Close")));
      const startBtn = h("button", { onclick: async () => {
        let pos; msg("Getting your location...");
        try { pos = await getPos(); } catch (e) { return msg(e.message, 1); }
        const code = Array.from(crypto.getRandomValues(new Uint8Array(5)), (n) => CH[n % CH.length]).join("");
        const { error } = await db.from("attendance_sessions").insert({ course_id: c.id, code, lat: pos.lat, lng: pos.lng, radius_m: 100 });
        if (error) return msg(error.message, 1);
        msg("Attendance started. Students must be within 100 metres of you.");
        vMine();
      } }, "Start attendance");
      return h("div", { class: "card" }, h("b", {}, c.code), h("div", {}, c.title), startBtn, ...list);
    }));
  }

  async function vResults() {
    const v = $("view");
    const { data: cs } = await db.from("courses").select("id,code,title").eq("lecturer_id", me.id).order("code");
    if (!cs || !cs.length) { v.replaceChildren(empty("No courses assigned to you yet.")); return; }
    const sel = h("select", { onchange: () => load() }, cs.map((c) => h("option", { value: c.id }, c.code + " - " + c.title)));
    const box = h("div");
    v.replaceChildren(h("div", { class: "card" }, sel), box);
    async function load() {
      const [{ data: en }, { data: rs }] = await Promise.all([
        db.from("enrollments").select("student_id,profiles(full_name,matric_no)").eq("course_id", sel.value),
        db.from("results").select("*").eq("course_id", sel.value)
      ]);
      if (!en || !en.length) { box.replaceChildren(empty("No students enrolled in this course yet.")); return; }
      const rm = Object.fromEntries((rs || []).map((r) => [r.student_id, r]));
      const rows = en.map((e) => {
        const r = rm[e.student_id] || {};
        const ca = h("input", { type: "number", min: 0, max: 30, placeholder: "CA (30)", value: r.ca_score ?? "" });
        const ex = h("input", { type: "number", min: 0, max: 70, placeholder: "Exam (70)", value: r.exam_score ?? "" });
        const p = e.profiles || {};
        return { id: e.student_id, ca, ex, node: h("div", { class: "card" }, h("b", {}, p.full_name || "Student"), h("div", { class: "sub" }, p.matric_no || ""), h("div", { class: "two" }, ca, ex)) };
      });
      const save = h("button", { onclick: async () => {
        const bad = rows.find((r) => Number(r.ca.value) < 0 || Number(r.ca.value) > 30 || Number(r.ex.value) < 0 || Number(r.ex.value) > 70);
        if (bad) return msg("CA must be 0 to 30 and exam must be 0 to 70.", 1);
        const payload = rows.map((r) => ({ course_id: sel.value, student_id: r.id, ca_score: Number(r.ca.value) || 0, exam_score: Number(r.ex.value) || 0 }));
        const { error } = await db.from("results").upsert(payload, { onConflict: "course_id,student_id" });
        msg(error ? error.message : "Results saved.", !!error);
      } }, "Save results");
      box.replaceChildren(...rows.map((r) => r.node), save);
    }
    load();
  }

  /* ---------- STUDENT ---------- */
  async function vJoin() {
    const [{ data: cs }, { data: en }] = await Promise.all([
      db.from("courses").select("*").order("code"),
      db.from("enrollments").select("course_id").eq("student_id", me.id)
    ]);
    const mine = new Set((en || []).map((e) => e.course_id));
    if (!(cs || []).length) { $("view").replaceChildren(empty("No courses available yet.")); return; }
    $("view").replaceChildren(...cs.map((c) => {
      const on = mine.has(c.id);
      const b = h("button", { class: on ? "ghost small" : "", onclick: async () => {
        const { error } = on
          ? await db.from("enrollments").delete().eq("course_id", c.id).eq("student_id", me.id)
          : await db.from("enrollments").insert({ course_id: c.id, student_id: me.id });
        if (error) return msg(error.message, 1);
        msg(on ? "Dropped " + c.code + "." : "Enrolled in " + c.code + "."); vJoin();
      } }, on ? "Drop course" : "Enroll");
      return h("div", { class: "card item" }, h("b", {}, c.code), h("div", {}, c.title), on && h("div", { class: "sub" }, "You are enrolled."), h("div", {}, b));
    }));
  }

  async function vAttend() {
    const code = h("input", { class: "big", placeholder: "CODE", maxlength: 5 });
    const btn = h("button", { onclick: async () => {
      msg("Checking your location...");
      let pos;
      try { pos = await getPos(); } catch (e) { return msg(e.message, 1); }
      const { data, error } = await db.rpc("mark_attendance", { p_code: code.value.trim(), p_lat: pos.lat, p_lng: pos.lng, p_acc: pos.acc, p_device: DEVICE });
      msg(error ? error.message : data, !!error || data !== "Attendance marked");
      vAttend();
    } }, "Mark attendance");
    const { data } = await db.rpc("my_attendance");
    $("view").replaceChildren(
      h("div", { class: "card" }, h("p", { class: "sub" }, "Enter the code your lecturer shows in class."), code, btn),
      ...(data || []).map((r) => {
        const pct = r.total_sessions ? Math.round(100 * r.attended / r.total_sessions) : 0;
        return h("div", { class: "card" }, h("b", {}, r.course_code), h("div", {}, r.title),
          h("div", { class: "bar" }, h("i", { style: "width:" + pct + "%" })),
          h("div", { class: "sub" }, r.attended + " of " + r.total_sessions + " sessions (" + pct + "%)"));
      }),
      !(data || []).length && empty("Enroll in a course to see your attendance."));
  }

  async function vGrades() {
    const { data } = await db.from("results").select("ca_score,exam_score,courses(code,title)").eq("student_id", me.id);
    if (!(data || []).length) { $("view").replaceChildren(empty("No results have been published for you yet.")); return; }
    $("view").replaceChildren(
      h("div", { class: "noprint" }, h("button", { class: "ghost", onclick: () => window.print() }, "Print results")),
      ...data.map((r) => {
        const t = Number(r.ca_score) + Number(r.exam_score), c = r.courses || {};
        return h("div", { class: "card" }, h("b", {}, c.code || "Course"), h("div", {}, c.title || ""),
          h("div", { class: "sub" }, "CA " + r.ca_score + ", Exam " + r.exam_score + ", Total " + t),
          h("div", { class: "grade" }, grade(t)));
      }));
  }
</script>
</body>
</html>
